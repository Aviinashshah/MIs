                            {/* 6. Total Ideal Cost */}
                            <KPICard title="Total Ideal Cost" value={formatCurrency(kpis.totalIdealCost)} subtext="Calculated Cost" icon={CurrencyIcon} color="text-rose-600" gradient="from-rose-50 to-white" trend={kpis.momIdealCost} inverseTrend={true} />
                            
                            {/* 7. Cancellation Rate */}
                            <KPICard title="Cancellation Rate" value={formatPct(kpis.cancelRate)} subtext={`${kpis.cancelledOrders} Failed`} icon={AlertCircleIcon} color={kpis.cancelRate > 2 ? "text-rose-600" : "text-emerald-600"} gradient={kpis.cancelRate > 2 ? "from-rose-50 to-white" : "from-emerald-50 to-white"} trend={kpis.momCancel} inverseTrend={true} />
                            
                            {/* 8. Avg Ticket */}
                            <KPICard title="Avg Ticket" value={formatCurrency(kpis.aov)} subtext="Per Order Value" icon={TrendingUpIcon} color="text-violet-600" gradient="from-violet-50 to-white" trend={kpis.momAov} />

                                        </div>
                                        <div className="lg:col-span-1 grid grid-cols-1 gap-4">
                                            <KPICard title="Store Velocity" value={kpis.velocity.toFixed(1)} subtext="Orders/Store/Day" icon={TrendingUpIcon} color="text-cyan-600" gradient="from-cyan-50 to-white" />
                                        </div>
                        </div>

                        <ProjectionSection data={baseFilteredData} />

                        {/* NEW: Time Slot Efficiency Card */}
                        <div className="glass-panel p-0 rounded-[2.5rem] border border-white/60 overflow-hidden bg-white/40 mb-16">

                                    <div>
                                        <h3 className="text-lg font-black text-gray-800 flex items-center gap-2">
                                            <span className="p-2 bg-indigo-100 text-indigo-600 rounded-lg"><ClockIcon size={18}/></span>
                                            Time Slot Efficiency
                                        </h3>
                                    </div>
                                    <CopyButton getText={getEfficiencyText} />
                            </div>
                            <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-white/40 text-xs text-gray-500 uppercase font-extrabold tracking-wider">
                                            <tr>
                                                <th className="px-6 py-4">Time Slot</th>
                                                <th className="px-6 py-4 text-right">Net Sales</th>
                                                <th className="px-6 py-4 text-right">Ideal % (Cart)</th>
                                                <th className="px-6 py-4 text-right">Disc % (Cart)</th>
                                                <th className="px-6 py-4 text-right">GM % (Net)</th>
                                            </tr>
                                        </thead>

                                            {timeSlotStats.map((row, idx) => (

                                                    <td className="px-6 py-4 text-right font-bold text-emerald-600">{row.gmPct.toFixed(1)}%</td>
                                                </tr>
                                            ))}
                                            {timeSlotStats.length === 0 && <tr><td colSpan="5" className="text-center py-6 text-gray-400">No data available</td></tr>}
                                        </tbody>
                                    </table>
                            </div>
                        </div>

                        <div className="glass-panel p-0 rounded-[2.5rem] border border-white/60 overflow-hidden bg-white/40 mb-16">

                                                    <span className="p-2 bg-blue-100 text-blue-600 rounded-lg"><TableIcon size={18}/></span>
                                                    SKSG & Growth Matrix

                                                        <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle">
                                                            <tspan x="50%" dy="-10" fontSize="24" fontWeight="900" fill="#1e293b">{formatNumber(kpis.totalOrders)}</tspan>

                                                    </PieChart>

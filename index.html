<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Brand Vibe Check (India Edition)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            purple: '#6366f1', // Indigo
                            pink: '#ec4899',   // Pink
                            cyan: '#06b6d4',   // Cyan
                            orange: '#f97316', // Orange
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Cool Abstract Background Image */
            background-image: url('https://images.unsplash.com/photo-1497294815431-9365093b7331?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #1e293b; /* Slate 800 */
        }
        
        /* Glassmorphism for Light Theme */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.5); 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const UploadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-brand-purple mb-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const ChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const TrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-600"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const GridIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>;
        const ListIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>;
        const RupeeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 10"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>;

        // --- Helper Functions ---
        const getMonthKey = (val) => {
            if (!val) return 'Total';
            let d = val;
            if (typeof val === 'number' && val > 20000) d = new Date((val - 25569) * 86400 * 1000);
            if (!(d instanceof Date)) d = new Date(val);
            if (isNaN(d.getTime())) return 'Total';
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        const getQuarterKey = (val) => {
            if (!val) return 'Total';
            let d = val;
            if (typeof val === 'number' && val > 20000) d = new Date((val - 25569) * 86400 * 1000);
            if (!(d instanceof Date)) d = new Date(val);
            if (isNaN(d.getTime())) return 'Total';
            return `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
        };

        const formatMonthLabel = (key) => {
            if (key === 'Total' || !key) return 'Total';
            const [y, m] = key.split('-');
            const date = new Date(parseInt(y), parseInt(m) - 1);
            return date.toLocaleString('default', { month: 'short', year: '2-digit' });
        };

        const formatQuarterLabel = (key) => {
            if (key === 'Total' || !key) return 'Total';
            const [y, q] = key.split('-');
            return `${q} ${y.slice(2)}`;
        };

        // --- Indian Currency Formatter ---
        const formatCurrency = (val, isAOV = false) => {
            if (val === 0 || isNaN(val)) return '₹0';
            
            // For AOV or small numbers, show exact value with commas
            if (isAOV || val < 100000) {
                return val.toLocaleString('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: isAOV ? 2 : 0,
                    minimumFractionDigits: isAOV ? 2 : 0
                });
            }
            
            // Large numbers: Crores (10,000,000)
            if (val >= 10000000) {
                return `₹${(val / 10000000).toFixed(2)} Cr`;
            }
            // Large numbers: Lakhs (100,000)
            if (val >= 100000) {
                return `₹${(val / 100000).toFixed(2)} L`;
            }
            
            return val.toLocaleString('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 0
            });
        };

        // --- Components ---

        const KpiCard = ({ title, value, subtext, gradient, icon }) => (
            <div className={`glass-panel p-5 rounded-2xl relative overflow-hidden group hover:shadow-lg transition-shadow duration-300`}>
                <div className={`absolute top-0 right-0 w-24 h-24 bg-gradient-to-br ${gradient} opacity-20 blur-2xl rounded-full -mr-8 -mt-8 transition-opacity group-hover:opacity-30`}></div>
                <h3 className="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
                    {icon} {title}
                </h3>
                <div className="text-2xl font-bold text-slate-800 mb-1 font-mono tracking-tight">{value}</div>
                <div className="text-xs text-slate-600 font-medium">{subtext}</div>
            </div>
        );

        const ProgressBar = ({ label, value, max, colorClass }) => {
            const percentage = Math.min(100, Math.max(0, (value / max) * 100));
            return (
                <div className="mb-3">
                    <div className="flex justify-between text-xs mb-1">
                        <span className="text-slate-600 font-medium truncate pr-2">{label}</span>
                        <span className="text-slate-500 font-mono">{formatCurrency(value)}</span>
                    </div>
                    <div className="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                        <div 
                            className={`h-full rounded-full ${colorClass} shadow-sm`} 
                            style={{ width: `${percentage}%` }}
                        ></div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [step, setStep] = useState(1);
            const [rawFiles, setRawFiles] = useState([]);
            const [rawData, setRawData] = useState([]);
            const [headers, setHeaders] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0); // Progress Bar State
            const [currentFile, setCurrentFile] = useState('');
            const [importStats, setImportStats] = useState([]);
            
            const [columnMapping, setColumnMapping] = useState({
                city: '', brand: '', product: '', sales: '', quantity: '', date: ''
            });

            const [selectedCity, setSelectedCity] = useState('All');
            const [selectedBrand, setSelectedBrand] = useState('All');
            const [selectedMonth, setSelectedMonth] = useState('All');
            const [trendMetric, setTrendMetric] = useState('sales');
            const [viewMode, setViewMode] = useState('monthly');
            const [processedCount, setProcessedCount] = useState(0);

            // --- File Handling ---
            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files || e.dataTransfer.files);
                if (files.length === 0) return;
                
                setIsProcessing(true);
                setUploadProgress(0);
                setRawFiles(files);

                // PERFORMANCE FIX: Don't spread large arrays in loops. 
                // Collect separate sheet arrays then flatten once.
                const collectedSheets = []; 
                let detectedHeaders = new Set();
                let stats = [];

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    setCurrentFile(file.name);
                    setUploadProgress(Math.round(((i) / files.length) * 100)); // Update progress start for file

                    try {
                        const { sheetData, sheetStats } = await readFile(file);
                        
                        // Collect headers from first few rows to avoid iterating everything if huge
                        // But for accurate mapping we usually scan. To optimize, scan first 100 rows per sheet.
                        if (sheetData.length > 0) {
                            const sample = sheetData.slice(0, 100); 
                            sample.forEach(row => Object.keys(row).forEach(k => detectedHeaders.add(k.trim())));
                            collectedSheets.push(sheetData);
                        }
                        
                        stats.push(...sheetStats.map(s => ({ ...s, fileName: file.name })));
                    } catch (err) { console.error(err); alert(`Error reading ${file.name}`); }
                    
                    setUploadProgress(Math.round(((i + 1) / files.length) * 100));
                }

                if (collectedSheets.length === 0) { 
                    setIsProcessing(false); 
                    setUploadProgress(0);
                    return; 
                }

                // Flatten efficiently
                const flatData = collectedSheets.flat();
                
                // Final Header Scan (if sampling missed keys in deep rows, we might miss them, but usually headers are top)
                setRawData(flatData);
                setHeaders(Array.from(detectedHeaders));
                setImportStats(stats);
                
                // Small delay to show 100%
                setTimeout(() => {
                    setIsProcessing(false);
                    setStep(2);
                }, 500);
            };

            const readFile = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        try {
                            // OPTIMIZATION: Parse XLSX more efficiently if possible
                            // We use 'dense: true' which can save memory
                            const workbook = XLSX.read(e.target.result, { type: 'array', cellDates: true, dense: true });
                            
                            let sheetStats = [];
                            const sheetsData = []; // Store arrays of rows per sheet

                            workbook.SheetNames.forEach(sheetName => {
                                const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { cellDates: true, defval: "" });
                                sheetStats.push({ name: sheetName, rowCount: json.length });
                                
                                // Normalize keys immediately
                                if (json.length > 0) {
                                    const cleanedJson = json.map(row => {
                                        const newRow = {};
                                        for (let key in row) newRow[key.trim()] = row[key];
                                        return newRow;
                                    });
                                    sheetsData.push(cleanedJson);
                                }
                            });
                            
                            // Flatten once at the end to avoid call stack issues and concat performance hits
                            const sheetData = sheetsData.flat();
                            
                            resolve({ sheetData, sheetStats });
                        } catch (error) { reject(error); }
                    };
                    
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });
            };

            // --- Auto Guess ---
            useEffect(() => {
                if (step === 2) {
                    const map = { ...columnMapping };
                    const lowerHeaders = headers.map(h => ({ raw: h, lower: h.toLowerCase() }));
                    const find = (k) => lowerHeaders.find(h => k.some(x => h.lower.includes(x)))?.raw || '';
                    if (!map.city) map.city = find(['city', 'region', 'state', 'town']);
                    if (!map.brand) map.brand = find(['brand', 'manufacturer', 'make']);
                    if (!map.product) map.product = find(['product', 'item', 'sku', 'desc']);
                    if (!map.sales) map.sales = find(['sales', 'revenue', 'amount', 'total', 'gsv', 'price', 'inr']);
                    if (!map.quantity) map.quantity = find(['qty', 'quantity', 'count', 'vol']);
                    if (!map.date) map.date = find(['date', 'time', 'period', 'month']);
                    setColumnMapping(map);
                }
            }, [step]);

            // --- Analysis Logic ---
            const analysis = useMemo(() => {
                if (step !== 3) return null;
                const { city, brand, product, sales, quantity, date } = columnMapping;
                
                const cities = new Set();
                const brands = new Set();
                const monthKeys = new Set();
                const quarterKeys = new Set();
                
                let count = 0;
                let totalRev = 0;
                let totalVol = 0;
                
                // Aggregations for charts
                const brandSales = {};
                const citySales = {};

                const filtered = rawData.filter(row => {
                    const rCity = row[city];
                    const rBrand = row[brand];
                    if (!rCity || !rBrand) return false;

                    const mKey = date && row[date] ? getMonthKey(row[date]) : 'Total';
                    const qKey = date && row[date] ? getQuarterKey(row[date]) : 'Total';
                    
                    if (selectedCity !== 'All' && rCity !== selectedCity) return false;
                    if (selectedBrand !== 'All' && rBrand !== selectedBrand) return false;
                    if (selectedMonth !== 'All' && mKey !== selectedMonth) return false;

                    count++;
                    cities.add(rCity);
                    brands.add(rBrand);
                    if (mKey !== 'Total') monthKeys.add(mKey);
                    if (qKey !== 'Total') quarterKeys.add(qKey);

                    // Parse Values
                    let vSales = parseFloat(String(row[sales]).replace(/[^0-9.-]+/g,"")) || 0;
                    let vQty = parseFloat(String(row[quantity]).replace(/[^0-9.-]+/g,"")) || 0;

                    totalRev += vSales;
                    totalVol += vQty;

                    // Chart Aggregations
                    brandSales[rBrand] = (brandSales[rBrand] || 0) + vSales;
                    citySales[rCity] = (citySales[rCity] || 0) + vSales;

                    return true;
                });

                setProcessedCount(count);

                // Top Products Logic
                const productMap = {};
                filtered.forEach(row => {
                    const pName = row[product];
                    const pBrand = row[brand];
                    // Removed city from aggregation scope
                    let vSales = parseFloat(String(row[sales]).replace(/[^0-9.-]+/g,"")) || 0;
                    let vQty = parseFloat(String(row[quantity]).replace(/[^0-9.-]+/g,"")) || 0;
                    
                    const mKey = date && row[date] ? getMonthKey(row[date]) : 'Total';
                    const qKey = date && row[date] ? getQuarterKey(row[date]) : 'Total';
                    
                    // Aggregate by Product + Brand only (merging cities)
                    const key = `${pName}|${pBrand}`;

                    if (!productMap[key]) {
                        productMap[key] = {
                            key, name: pName, brand: pBrand,
                            totalSales: 0, totalQty: 0, months: {}, quarters: {}
                        };
                    }
                    productMap[key].totalSales += vSales;
                    productMap[key].totalQty += vQty;

                    if (!productMap[key].months[mKey]) productMap[key].months[mKey] = { sales: 0, qty: 0 };
                    productMap[key].months[mKey].sales += vSales;
                    productMap[key].months[mKey].qty += vQty;

                    if (!productMap[key].quarters[qKey]) productMap[key].quarters[qKey] = { sales: 0, qty: 0 };
                    productMap[key].quarters[qKey].sales += vSales;
                    productMap[key].quarters[qKey].qty += vQty;
                });

                const topProducts = Object.values(productMap)
                    .map(item => ({ ...item, aov: item.totalQty > 0 ? (item.totalSales / item.totalQty) : 0 }))
                    .sort((a, b) => b.totalSales - a.totalSales)
                    .slice(0, 20);

                // Prepare Charts Data
                const topBrands = Object.entries(brandSales)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([k, v]) => ({ name: k, value: v }));
                
                const topCities = Object.entries(citySales)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([k, v]) => ({ name: k, value: v }));

                return {
                    uniqueCities: Array.from(cities).sort(),
                    uniqueBrands: Array.from(brands).sort(),
                    uniqueMonthKeys: Array.from(monthKeys).sort(),
                    topProducts,
                    sortedMonthKeys: Array.from(monthKeys).sort(),
                    sortedQuarterKeys: Array.from(quarterKeys).sort(),
                    totalRev,
                    totalVol,
                    topBrands,
                    topCities
                };
            }, [rawData, columnMapping, selectedCity, selectedBrand, selectedMonth, step]);

            const exportData = () => {
                if (!analysis) return;
                const exportRows = analysis.topProducts.map((p, idx) => {
                    const row = {
                        Rank: idx + 1,
                        Product: p.name,
                        Brand: p.brand,
                        // City removed from export
                        AOV: p.aov,
                        'Total Sales': p.totalSales,
                        'Total Qty': p.totalQty
                    };
                    const keys = viewMode === 'monthly' ? analysis.sortedMonthKeys : analysis.sortedQuarterKeys;
                    const src = viewMode === 'monthly' ? p.months : p.quarters;
                    const formatter = viewMode === 'monthly' ? formatMonthLabel : formatQuarterLabel;
                    
                    keys.forEach(k => {
                        const d = src[k] || { sales: 0, qty: 0 };
                        const lbl = formatter(k);
                        row[`${lbl} Sales`] = d.sales;
                        row[`${lbl} AOV`] = d.qty > 0 ? d.sales / d.qty : 0;
                    });
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exportRows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Analysis");
                XLSX.writeFile(wb, `Analyzer_Export_${viewMode}.xlsx`);
            };

            // --- Rendering ---
            
            // Step 1: Upload
            if (step === 1) return (
                <div className="min-h-screen flex items-center justify-center p-6 relative">
                    <div className="glass-panel max-w-lg w-full p-10 rounded-3xl text-center relative z-10 animate-fade-in shadow-2xl">
                        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 mb-6 border border-indigo-100 shadow-sm">
                            <UploadIcon />
                        </div>
                        <h1 className="text-4xl font-bold mb-3 tracking-tight text-slate-800"><span className="gradient-text">Sales Vibe Check</span></h1>
                        <p className="text-slate-500 mb-8 text-sm leading-relaxed">Drop your messy Excel sheets here. We'll turn them into aesthetic insights instantly. India Region Ready (INR).</p>
                        
                        {isProcessing ? (
                            <div className="w-full">
                                <div className="flex justify-between text-xs font-semibold text-slate-600 mb-2">
                                    <span>Processing: {currentFile}</span>
                                    <span>{uploadProgress}%</span>
                                </div>
                                <div className="w-full bg-slate-200 rounded-full h-2.5">
                                    <div className="bg-brand-purple h-2.5 rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                                </div>
                                <div className="mt-4 text-xs text-slate-400">Optimizing data chunks...</div>
                            </div>
                        ) : (
                            <div 
                                className="group border-2 border-dashed border-slate-300 hover:border-brand-purple rounded-2xl p-10 cursor-pointer transition-all duration-300 bg-white/50 hover:bg-white/80"
                                onDragOver={e => e.preventDefault()}
                                onDrop={e => { e.preventDefault(); handleFileUpload(e); }}
                            >
                                <input type="file" multiple className="hidden" id="fileInput" onChange={handleFileUpload} />
                                <label htmlFor="fileInput" className="cursor-pointer block">
                                    <span className="block text-slate-700 font-semibold mb-1 group-hover:text-brand-purple transition-colors">Click to Upload</span>
                                    <span className="block text-slate-400 text-xs">or drag and drop</span>
                                </label>
                            </div>
                        )}
                        <div className="mt-8 text-[10px] uppercase font-bold tracking-widest text-slate-300">
                            Powered By The Huger Gains
                        </div>
                    </div>
                </div>
            );

            // Step 2: Mapping
            if (step === 2) return (
                <div className="min-h-screen p-8 flex justify-center items-start">
                    <div className="w-full max-w-4xl animate-fade-in">
                        <h2 className="text-3xl font-bold mb-2 text-slate-900">Connect Your Data</h2>
                        <p className="text-slate-600 mb-8">Tell us which columns are which. We've auto-guessed the obvious ones.</p>
                        
                        <div className="glass-panel p-8 rounded-3xl mb-6 shadow-md">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {Object.keys(columnMapping).map(key => (
                                    <div key={key}>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                                            {key === 'sales' ? 'Revenue / Sales (INR)' : key} <span className="text-brand-pink">*</span>
                                        </label>
                                        <select 
                                            value={columnMapping[key]}
                                            onChange={e => setColumnMapping({...columnMapping, [key]: e.target.value})}
                                            className="w-full bg-white border border-slate-300 text-slate-700 text-sm rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-purple focus:border-transparent outline-none transition-all shadow-sm"
                                        >
                                            <option value="">Select Column...</option>
                                            {headers.map(h => <option key={h} value={h}>{h}</option>)}
                                        </select>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Import Summary */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                            {importStats.map((s, i) => (
                                <div key={i} className="glass-panel p-3 rounded-xl text-xs">
                                    <div className="font-bold text-slate-700 truncate">{s.name}</div>
                                    <div className="text-slate-500">{s.rowCount.toLocaleString()} rows</div>
                                </div>
                            ))}
                        </div>

                        <div className="flex justify-end items-center gap-6">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Powered By The Huger Gains</span>
                            <button 
                                onClick={() => {
                                    if(Object.values(columnMapping).some(v => !v)) return alert("Map all fields!");
                                    setStep(3);
                                }}
                                className="bg-slate-900 text-white hover:bg-slate-800 px-8 py-3 rounded-xl font-bold text-sm transition-transform active:scale-95 flex items-center shadow-lg"
                            >
                                Generate Dashboard <span className="ml-2"><ChevronRight /></span>
                            </button>
                        </div>
                    </div>
                </div>
            );

            // Step 3: Dashboard
            if (!analysis) return null;
            const { topProducts, totalRev, totalVol, topBrands, topCities } = analysis;
            const overallAOV = totalVol > 0 ? totalRev / totalVol : 0;
            const maxBrandVal = Math.max(...topBrands.map(b => b.value), 0);
            const maxCityVal = Math.max(...topCities.map(c => c.value), 0);

            return (
                <div className="min-h-screen pb-12 animate-fade-in">
                    {/* Header */}
                    <div className="sticky top-0 z-50 glass-panel border-b border-white/20">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-md">
                                    <GridIcon />
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 leading-tight text-lg">Sales Analyzer <span className="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full ml-2">India Region</span></h1>
                                    <div className="text-xs text-slate-500 font-mono">{processedCount.toLocaleString()} rows processed</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                {/* Filters */}
                                <div className="hidden md:flex bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    {['monthly', 'quarterly'].map(m => (
                                        <button 
                                            key={m}
                                            onClick={() => setViewMode(m)}
                                            className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${viewMode === m ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            {m.charAt(0).toUpperCase() + m.slice(1)}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={exportData} className="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-800 transition-colors flex items-center gap-2 shadow-md">
                                    <DownloadIcon /> Export
                                </button>
                            </div>
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto px-6 pt-8">
                        {/* KPI Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <KpiCard icon={<RupeeIcon />} title="Total Revenue" value={formatCurrency(totalRev)} subtext="Across all regions" gradient="from-purple-400 to-blue-400" />
                            <KpiCard icon={<ListIcon />} title="Total Volume" value={totalVol.toLocaleString()} subtext="Units sold" gradient="from-pink-400 to-rose-400" />
                            <KpiCard icon={<RupeeIcon />} title="Avg Order Value" value={formatCurrency(overallAOV, true)} subtext="Rev / Qty" gradient="from-emerald-400 to-cyan-400" />
                            <KpiCard icon={<TrendingUp />} title="Top Brand" value={topBrands[0]?.name || '-'} subtext={`${((topBrands[0]?.value / totalRev) * 100).toFixed(1)}% Share`} gradient="from-orange-400 to-amber-400" />
                        </div>

                        {/* Deep Dive Section */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                            {/* Brand Share */}
                            <div className="glass-panel p-6 rounded-3xl col-span-1 shadow-sm">
                                <h3 className="text-slate-800 font-bold mb-4 flex items-center gap-2"><TrendingUp /> Top Brands by Share</h3>
                                {topBrands.map((b, i) => (
                                    <ProgressBar key={i} label={b.name} value={b.value} max={maxBrandVal} colorClass="bg-gradient-to-r from-violet-500 to-fuchsia-500" />
                                ))}
                            </div>

                            {/* City Share */}
                            <div className="glass-panel p-6 rounded-3xl col-span-1 shadow-sm">
                                <h3 className="text-slate-800 font-bold mb-4 flex items-center gap-2"><GridIcon /> Top Cities by Share</h3>
                                {topCities.map((c, i) => (
                                    <ProgressBar key={i} label={c.name} value={c.value} max={maxCityVal} colorClass="bg-gradient-to-r from-cyan-500 to-blue-500" />
                                ))}
                            </div>

                            {/* Controls & Mini Filters */}
                            <div className="glass-panel p-6 rounded-3xl col-span-1 flex flex-col justify-between shadow-sm">
                                <div>
                                    <h3 className="text-slate-800 font-bold mb-4">Quick Filters</h3>
                                    <div className="space-y-3">
                                        <select value={selectedCity} onChange={e => setSelectedCity(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 outline-none focus:border-brand-purple shadow-sm">
                                            <option value="All">All Cities</option>
                                            {analysis.uniqueCities.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <select value={selectedBrand} onChange={e => setSelectedBrand(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 outline-none focus:border-brand-purple shadow-sm">
                                            <option value="All">All Brands</option>
                                            {analysis.uniqueBrands.map(b => <option key={b} value={b}>{b}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="mt-6 bg-slate-50 rounded-xl p-4 border border-slate-200">
                                    <div className="text-xs text-slate-500 uppercase tracking-wider mb-2 font-bold">Trend Metric</div>
                                    <div className="flex bg-white p-1 rounded-lg border border-slate-200">
                                        <button onClick={() => setTrendMetric('sales')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-colors ${trendMetric === 'sales' ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-500'}`}>Sales</button>
                                        <button onClick={() => setTrendMetric('aov')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-colors ${trendMetric === 'aov' ? 'bg-orange-50 text-orange-700 shadow-sm' : 'text-slate-500'}`}>AOV</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Main Table */}
                        <div className="glass-panel rounded-3xl overflow-hidden border border-slate-200 shadow-lg">
                            <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-white/40">
                                <h2 className="font-bold text-slate-800 flex items-center gap-2">
                                    <ListIcon /> Top 20 Breakdown
                                </h2>
                            </div>
                            
                            <div className="overflow-x-auto max-h-[600px]">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="sticky top-0 z-20 bg-slate-50 shadow-md">
                                        <tr className="text-slate-500 border-b border-slate-200">
                                            <th className="px-6 py-4 font-bold w-16 bg-slate-50 sticky left-0 z-20">#</th>
                                            <th className="px-6 py-4 font-bold sticky left-16 bg-slate-50 z-20 shadow-[4px_0_12px_-4px_rgba(0,0,0,0.1)]">Product</th>
                                            <th className="px-6 py-4 font-bold">Brand</th>
                                            {/* City Header Removed */}
                                            {/* Dynamic Columns */}
                                            {(viewMode === 'monthly' ? analysis.sortedMonthKeys : analysis.sortedQuarterKeys).map(k => (
                                                <th key={k} className="px-4 py-4 font-bold text-right border-l border-slate-200 text-slate-600">
                                                    {viewMode === 'monthly' ? formatMonthLabel(k) : formatQuarterLabel(k)}
                                                </th>
                                            ))}
                                            <th className="px-6 py-4 font-bold text-right text-brand-purple bg-indigo-50/50 border-l border-slate-200">Total Sales</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 bg-white">
                                        {topProducts.map((item, idx) => (
                                            <tr key={idx} className="hover:bg-indigo-50/30 transition-colors group">
                                                <td className="px-6 py-3 font-mono text-slate-400 sticky left-0 bg-white group-hover:bg-indigo-50/30 transition-colors z-10 border-r border-slate-100">{idx + 1}</td>
                                                <td className="px-6 py-3 font-medium text-slate-800 sticky left-16 bg-white group-hover:bg-indigo-50/30 transition-colors z-10 shadow-[4px_0_12px_-4px_rgba(0,0,0,0.05)]">{item.name}</td>
                                                <td className="px-6 py-3 text-slate-500">{item.brand}</td>
                                                {/* City Data Cell Removed */}
                                                
                                                {(viewMode === 'monthly' ? analysis.sortedMonthKeys : analysis.sortedQuarterKeys).map(k => {
                                                    const d = (viewMode === 'monthly' ? item.months : item.quarters)[k] || { sales: 0, qty: 0 };
                                                    let val = '-';
                                                    if (trendMetric === 'sales') val = d.sales > 0 ? formatCurrency(d.sales) : '-';
                                                    else val = d.qty > 0 ? formatCurrency(d.sales / d.qty, true) : '-'; // Pass true for AOV precision
                                                    
                                                    return (
                                                        <td key={k} className="px-4 py-3 text-right font-mono text-slate-600 border-l border-slate-100 text-xs">
                                                            {val}
                                                        </td>
                                                    );
                                                })}

                                                <td className="px-6 py-3 text-right font-mono font-bold text-indigo-600 bg-indigo-50/30 border-l border-slate-200">
                                                    {formatCurrency(item.totalSales)}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="text-center mt-12 mb-8 text-slate-500 text-xs font-bold uppercase tracking-widest">
                            Powered By The Huger Gains
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
